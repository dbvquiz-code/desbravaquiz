<style>
:root{--verde:#1F5D3A;--verde-esc:#143D27;--verde-claro:#E3F0E6;--verde-ok:#2E9E5B;--amarelo:#FFC531;--amarelo-esc:#D9A100;--amarelo-claro:#FFF3C9;--vermelho:#D7362B;--vermelho-txt:#B42318;--papel:#FBF8EF;--areia:#F1ECDD;--borda:#E6E1D1;--borda2:#D8D2BF;--tinta:#1B2A20;--cinza:#5B6B60}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--papel);font-family:'Nunito',system-ui,sans-serif;color:var(--tinta)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.h{font-family:'Baloo 2',system-ui,sans-serif;font-weight:800;margin:0;line-height:1.1}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--cinza)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:0;font-weight:800;font-size:15px;text-decoration:none}
.btn-y{background:var(--amarelo);color:var(--tinta);box-shadow:0 3px 0 var(--amarelo-esc)}
.btn-g{background:var(--verde);color:#fff}
.btn-o{background:#fff;border:2px solid var(--verde);color:var(--verde)}
.btn-r{background:var(--vermelho);color:#fff}
.btn-ro{background:#fff;border:2px solid var(--vermelho);color:var(--vermelho-txt)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;background:var(--areia)}
.pill{border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;display:inline-block}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:13.5px;font-weight:800}
.inp{min-height:44px;border:2px solid var(--borda2);border-radius:12px;background:#fff;padding:0 12px;font-size:15px;width:100%}
.inp:focus{outline:none;border-color:var(--verde)}
textarea.inp{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.45}
.err{color:var(--vermelho-txt);font-weight:700;font-size:14px}
.ok{color:var(--verde);font-weight:700;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--areia);text-align:left;padding:10px 12px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--areia);vertical-align:top}
.tblbox{overflow-x:auto}
.layout{display:flex;flex-wrap:wrap;min-height:100vh}
nav.side{flex:1 1 230px;max-width:260px;background:var(--verde-esc);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
nav.side button{text-align:left;border:0;background:transparent;color:#E3F0E6;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700}
nav.side button.on{background:var(--amarelo);color:var(--tinta)}
main{flex:999 1 560px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:18px}
.grid2{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:50;max-width:90%;text-align:center}
.modal-bg{position:fixed;inset:0;background:rgba(14,42,27,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:20px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px}
.busy{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--amarelo),var(--verde));z-index:60;animation:b 1s linear infinite}
@keyframes b{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
.p{margin:0;line-height:1.55}
.imgph{height:110px;border:2px dashed var(--borda2);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--cinza);font-weight:700;font-size:13px;text-align:center;padding:0 10px}
.prev{background:var(--papel);border:1px solid var(--borda);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:420px}
@media (max-width:720px){nav.side{max-width:none;flex-direction:row;flex-wrap:wrap}main{padding:14px}}
</style>

    batch:async ops=>{ for(let i=0;i<ops.length;i+=400){ const b=F.writeBatch(db); ops.slice(i,i+400).forEach(o=>{ const r=F.doc(db,o.col,o.id); if(o.del) b.delete(r); else b.set(r,o.data,{merge:true}); }); await b.commit(); } }
  };
}

async function loadAll(){

  S.specs=specs.sort((a,b)=>String(a.codigo).localeCompare(String(b.codigo)));

  S.assocs=assocs.sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt'));
  S.avisos=avisos.sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));

function nextCode(area){ let n=0; S.specs.forEach(s=>{ const m=/^([A-Z]{2})-(\d{3})$/.exec(s.codigo||''); if(m&&m[1]===area) n=Math.max(n,+m[2]); }); return area+'-'+String(n+1).padStart(3,'0'); }

async function loadMat(id){ S.matSpec=id; S.mat=null; if(!id) return; const m=await api.get('materiais',id); const texts=Array.from({length:N_TXT},(_,i)=>({titulo:(m&&m.textos&&m.textos[i]&&m.textos[i].titulo)||'',corpo:(m&&m.textos&&m.textos[i]&&m.textos[i].corpo)||''}));

async function zerarPontos(tudo){
  const [perfis,clubes]=await Promise.all([api.list('perfis'),api.list('clubes')]);

function resizeImage(file){ return new Promise((ok,bad)=>{ const r=new FileReader(); r.onerror=bad; r.onload=()=>{ const im=new Image(); im.onerror=bad; im.onload=()=>{ let max=900, q=0.78, out=''; for(let t=0;t<6;t++){ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); out=c.toDataURL('image/jpeg',q); if(out.length<600000) break; max=Math.round(max*0.8); q=Math.max(0.5,q-0.08); } ok(out); }; im.src=r.result; }; r.readAsDataURL(file); }); }
const validImg=s=>/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(s||'') && s.length<900000;

async function importBackup(txt){
  let j; try{ j=JSON.parse(txt); }catch(e){ S.err='Arquivo inválido (não é JSON).'; return render(); }
  if(!j||j.tipo!=='desbravaquiz-backup'||!Array.isArray(j.especialidades)){ S.err='Este arquivo não é um backup do DesbravaQuiz.'; return render(); }
  const specs=j.especialidades.map(s=>({codigo:cleanLine(s.codigo,6).toUpperCase(),nome:cleanName(s.nome,60),area:AREAS_PADRAO[s.area]?s.area:'',paga:!!s.paga,publicada:!!s.publicada,oldId:String(s.id||'')})).filter(s=>/^[A-Z]{2}-\d{3}$/.test(s.codigo)&&s.area&&s.codigo.slice(0,2)===s.area&&s.nome.length>=3);
  const idMap={}; specs.forEach(s=>{ idMap[s.oldId]=s.codigo; });
  const qs=(j.perguntas||[]).map(q=>({espId:idMap[String(q.espId)],enunciado:cleanLine(q.enunciado,200),certa:cleanLine(q.certa,120),erradas:(Array.isArray(q.erradas)?q.erradas:[]).slice(0,3).map(x=>cleanLine(x,120)),explicacao:cleanLine(q.explicacao,300),dificuldade:['facil','media','dificil'].includes(q.dificuldade)?q.dificuldade:'facil',oldId:String(q.id||'')})).filter(q=>q.espId&&q.enunciado&&q.certa&&q.erradas.length===3&&q.erradas.every(Boolean));
  const imgs=(j.imagens||[]).filter(i=>validImg(i.data)&&idMap[String(i.espId)]);
  const mats=(j.materiais||[]).map(m=>({espId:idMap[String(m.espId||m.id)],textos:Array.from({length:N_TXT},(_,i)=>({titulo:cleanLine(((m.textos||[])[i]||{}).titulo,80),corpo:cleanBlock(((m.textos||[])[i]||{}).corpo,2000)})),imagens:Array.from({length:N_IMG},(_,i)=>{ const r=(m.imagens||[])[i]||{}; const has=imgs.some(x=>String(x.id)===String(r.imgId)); const keep=!!r.imgId; return {imgId:keep?idMap[String(m.espId||m.id)]+'_'+i:'',legenda:cleanLine(r.legenda,120),_old:has?String(r.imgId):''}; })})).filter(m=>m.espId);
  ask('Importar backup?',`${specs.length} especialidade(s), ${qs.length} pergunta(s), ${mats.length} material(is) e ${imgs.length} imagem(ns) válidos serão gravados. Itens com o mesmo código são atualizados.`,'Importar',()=>run(async()=>{
    const ops=[]; specs.forEach(s=>ops.push({col:'especialidades',id:s.codigo,data:{nome:s.nome,area:s.area,codigo:s.codigo,paga:s.paga,publicada:s.publicada,atualizadaEm:Date.now()}}));
    const seen=new Set(); qs.forEach(q=>{ const id=(q.oldId&&!seen.has(q.oldId)&&/^[A-Za-z0-9_-]{6,40}$/.test(q.oldId))?q.oldId:null; if(id) seen.add(id); ops.push({col:'perguntas',id:id||('imp'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)),data:{espId:q.espId,enunciado:q.enunciado,certa:q.certa,erradas:q.erradas,explicacao:q.explicacao,dificuldade:q.dificuldade,criadaEm:Date.now()}}); });
    mats.forEach(m=>{ m.imagens.forEach((r,i)=>{ if(r._old){ const src=imgs.find(x=>String(x.id)===r._old); ops.push({col:'imagens',id:r.imgId,data:{data:src.data,espId:m.espId,atualizadaEm:Date.now()}}); } delete r._old; }); ops.push({col:'materiais',id:m.espId,data:{espId:m.espId,textos:m.textos,imagens:m.imagens,atualizadoEm:Date.now()}}); });
    await api.batch(ops); await loadAll(); for(const s of specs) await recountSpec(s.codigo); toast('Importação concluída!'); }));
}

// ---------- sessão: sai sozinho após 30 min sem uso ----------
['mousemove','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
setInterval(()=>{ if(S.user&&Date.now()-lastAct>SESSION_MIN*60000){ api.logout(); S.msg='Sessão encerrada por inatividade.'; } },30000);

// ---------- início ----------
(async()=>{
  render();
  try{ await initApi(); }catch(e){ S.cfgErr = e.message==='config' ? 'Cole a configuração do app Web do Firebase no topo deste arquivo (const firebaseConfig).' : 'Não foi possível carregar o Firebase: '+e.message; return render(); }
  api.onAuth(u=>{ S.user=u&&u.email?u:null; S.loaded=false; S.err=''; if(u&&u.email&&u.email!==ADMIN_EMAIL){ api.logout(); S.err='Esta conta não é de administrador.'; } render(); if(S.user) run(loadAll); });
})();
</script>
</body>
